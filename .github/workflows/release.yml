name: Release (Packages + Pages)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & publish jars + javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # tag 推送时以 tag 版本为准（去掉 v 前缀）；手动触发时使用 gradle.properties 版本
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "version_arg=-Pversion=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "version_arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ./gradlew build ${{ steps.version.outputs.version_arg }} --stacktrace

      # GitHub Packages 的版本不可覆盖：同一版本重复 PUT 会返回 422。
      # 另：Maven 包名（artifactId）必须全小写（kelp-lib-*），混合大小写首次发布即 422。
      # 发布前逐模块探测，已存在的版本自动跳过（重跑工作流幂等）。
      - name: Check already-published modules
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${GITHUB_REPOSITORY,,}"
          MISSING=""
          for artifact in kelp-lib-api kelp-lib-core kelp-lib-bukkit kelp-lib-velocity; do
            url="https://maven.pkg.github.com/${REPO}/ink/tuanzi/${artifact}/${VERSION}/${artifact}-${VERSION}.pom"
            code="$(curl -s -o /dev/null -w '%{http_code}' -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "$url" || true)"
            echo "${artifact}: HTTP ${code}"
            if [ "$code" != "200" ]; then
              MISSING="${MISSING}${artifact} "
            fi
          done
          echo "missing=${MISSING}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        if: steps.check.outputs.missing != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # MISSING 里是发布坐标（kelp-lib-*）；Gradle 任务路径用项目名（kelpLib-*）
          for artifact in ${{ steps.check.outputs.missing }}; do
            project="kelpLib-${artifact#kelp-lib-}"
            ./gradlew ":${project}:publish" ${{ steps.version.outputs.version_arg }} \
              --no-configuration-cache --stacktrace
          done

      - name: Generate JavaDoc (api stable surface)
        run: ./gradlew :kelpLib-api:javadoc ${{ steps.version.outputs.version_arg }}

      - name: Upload plugin jars (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            kelpLib-bukkit/build/libs/*-all.jar
            kelpLib-velocity/build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kelpLib-api/build/docs/javadoc

  deploy-pages:
    name: Deploy JavaDoc to GitHub Pages
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
